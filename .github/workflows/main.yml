name: Build Netcore N60-Pro Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取源码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 安装依赖
      - name: Setup dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git libncurses5-dev zlib1g-dev gawk flex quilt libssl-dev libelf-dev perl

      # 3. 创建 sysctl 优化文件
      - name: Setup N60-Pro sysctl optimizations
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p files/etc
          echo 'net.core.rmem_max = 16777216' > files/etc/sysctl.conf
          echo 'net.core.wmem_max = 16777216' >> files/etc/sysctl.conf
          echo 'net.ipv4.tcp_rmem = 4096 87380 16777216' >> files/etc/sysctl.conf
          echo 'net.ipv4.tcp_wmem = 4096 65536 16777216' >> files/etc/sysctl.conf
          echo 'net.ipv4.tcp_congestion_control = bbr' >> files/etc/sysctl.conf
          echo 'net.ipv4.tcp_mtu_probing = 1' >> files/etc/sysctl.conf

      # 4. 编译固件（非交互式）
      - name: Compile N60-Pro firmware
        run: |
          cd $GITHUB_WORKSPACE
          make defconfig
          make -j$(nproc)

      # 5. 上传固件产物
      - name: Upload N60-Pro firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: n60-pro-firmware
          path: bin/targets/mediatek/mt7986/openwrt-immortalwrt-6.6-netcore_n60_pro-squashfs-sysupgrade.bin
